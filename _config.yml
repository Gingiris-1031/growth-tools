# Site settings
title: Growth Tools Blog
description: 出海增长实战经验、工具测评、SEO/GEO 策略分享 by Gingiris
url: "https://gingiris.github.io"
baseurl: "/growth-tools"
author:
  name: Iris Wei
  email: iris.wei@gingiris.com
  url: https://gingiris.com
  twitter: WeiYipei

# SEO / GEO — emitted by jekyll-seo-tag plugin
logo: https://gingiris.github.io/growth-tools/favicon.svg
twitter:
  username: WeiYipei
  card: summary_large_image
social:
  name: Iris Wei
  links:
    - https://x.com/WeiYipei
    - https://github.com/Gingiris
    - https://gingiris.com

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Iris Wei"

# Exclude
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
