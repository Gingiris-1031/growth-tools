    这是一个稍纵即逝的窗口期：晚两周发布，注意力红利就没了。
  moves:
    - name: "竞品危机做成内容钩子"
      text: "把竞品信任危机转写成 Reddit 讨论钩子，让社区自己把「开源替代」的叙事聊起来。"
    - name: "quote 堆量替代 thread"
