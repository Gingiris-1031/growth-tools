    2024 年，某 AI 建站产品首次全球发布，可用预算约 $1.5 万。常规做法是投信息流广告或
    全力冲 Product Hunt 日榜，但两条路的获客成本都算不过账。我们决定把预算主力全部
    压到 KOL 协同发布上。
  moves:
    - name: "预算全压 KOL 协同"
      text: "不投广告，把 $1.5 万预算投给 35 个 KOL 的协同发布，按平台与量级分层定价。"
    - name: "五天铺开的发布节奏"
      text: "不是一天引爆而是五天滚动铺开，让每一波内容都能借上一波的热度。"
    - name: "转化链路预先铺好"
      text: "曝光进站后由落地页承接，UV→注册转化做到 25%，流量不白来。"
  result: >-
