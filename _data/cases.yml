  takeaways:
    - "<strong>竞品危机是最好的发布窗口</strong>——把头部竞品的信任危机直接做成 Reddit 内容钩子。"
    - "<strong>Twitter 预算从 thread 转向 quote 堆量</strong>，同预算下曝光效率更高。"
    - "<strong>HN 双稿分发</strong>：一个渠道两次机会，角度不同就不算重复。"
