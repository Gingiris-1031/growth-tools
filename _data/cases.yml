    - name: "HN 双稿分发"
      text: "Hacker News 准备两份不同角度的稿子分发，最大化单渠道的命中概率。"
    - name: "开源项目矩阵联动"
      text: "联动多个开源项目做矩阵宣发，互相转发、互相背书，放大发布声量。"
  result: >-
