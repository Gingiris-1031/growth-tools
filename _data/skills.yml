  howto:
    title: "The monthly 300-stars cadence"
    steps:
      - name: "1 · Content rhythm"
        text: "Ship 8–12 pieces/month: 2–3 weekly technical posts (dev.to / Medium / blog) for long-tail SEO, 1 weekly YouTube demo, 1–2 daily Twitter/X technical snippets, and a weekly LinkedIn long-form."
      - name: "2 · Community operations"
        text: "Post on Reddit 2–3×/week (r/selfhosted, r/programming, r/MachineLearning) as the steady workhorse, submit to Hacker News 1–2×/month for spikes (200–500 stars/post), and stay active daily in Discord/Telegram."
      - name: "3 · Event-driven growth"
        text: "Run a monthly online AMA/webinar (~30 attendees), a quarterly meetup (~70, deep in one market like Japan), and a quarterly PR challenge (Hacktoberfest / Good First Issue sprint)."
      - name: "4 · Contributor ladder"
        text: "Label 3–5 Good First Issues weekly, respond to PRs within 24h, and promote contributors up the ladder: Good First Issue → Regular (3+ PRs) → Core (module owner) → Maintainer."
      - name: "5 · Ambassador program"
        text: "Recruit advocates who already share the project and have 1k+ followers; reward with a badge, README credit, early-feature access, and a 10–15% affiliate referral."
