  install: Gingiris-1031/gingiris-twitter-agent-ops
  title: "Twitter/X Agent Operations — AI Ghostwriter SOP (+60% in 45 Days) | Gingiris"
  h1: "Twitter/X Agent Operations — AI Ghostwriter SOP"
  tagline: "Turn any AI agent into a ghostwriter that sounds like you — and grew a real account +60% in 45 days."
  meta_description: "Twitter/X agent SOP: persona calibration, fact-source database (zero fabricated stats), weekly scheduling, 6 safety rules, pre-publish QC. Grew a real account +60% in 45 days, fully agent-operated."
  keywords: "twitter automation, X account growth, AI ghostwriter, social media agent, persona calibration, tweet scheduling, AI agent twitter, content methodology"
  software_description: "Complete SOP for AI-agent-driven Twitter/X operations that sound like you: persona calibration (voice guide, dead-opener blacklist), a fact-source database for zero fabricated stats, weekly scheduling with dedup and golden time windows, six hard safety rules, pre-publish QC, and an analytics loop. Real case: +60% followers in 45 days, fully agent-operated."
  app_category: DeveloperApplication
  what: "You know you should post daily, but writing eats your evenings — and when AI writes for you, it sounds nothing like you. This SOP turns any agent into a ghostwriter that <strong>actually sounds like you</strong>, with a fact-source database so it never fabricates numbers, and safety rails so it never embarrasses you. Real result: +60% in 45 days."
  takeaways:
    - "<strong>Persona calibration</strong> (voice guide + dead-opener blacklist) is what makes AI sound like you, not a bot."
    - "A <strong>fact-source database (SOURCE-INDEX)</strong> means every stat is traceable — zero fabricated numbers."
    - "<strong>Six hard safety rules + pre-publish QC</strong> (triple-translation test) before anything posts."
    - "Validated: <strong>1,150 → 1,837 followers (+60%) in 45 days</strong>, one tweet/day, fully agent-operated."
  stats:
    - ["Follower growth in 45 days", "+60%"]
    - ["Posting cadence", "1 tweet/day"]
    - ["Tweet dataset analyzed", "3,861 tweets"]
    - ["Hard safety rules", "6"]
  howto:
    title: "How to run an AI Twitter ghostwriter"
    steps:
      - name: "1 · Calibrate the persona"
        text: "Build a voice guide and expression rules, plus a dead-opener blacklist, so the agent writes in your voice instead of generic AI cadence."
      - name: "2 · Build the fact-source database"
        text: "Create a SOURCE-INDEX of traceable facts and numbers. The agent may only cite stats that exist in the index — this is how it never fabricates."
      - name: "3 · Schedule the week"
        text: "Plan posts on a weekly schedule with dedup checks against past tweets and golden time windows (derived from a 3,861-tweet analysis)."
      - name: "4 · Pre-publish QC"
        text: "Run every draft through the six hard safety rules and a pre-publish checklist, including a triple-translation test, before it goes live."
      - name: "5 · Analytics loop"
        text: "Keep a tweet-log and weekly report so the agent learns which archetypes and lengths perform, and feeds that back into scheduling."
  compare:
    title: "Hand-written vs AI-agent-operated"
    intro: "The goal isn't to remove you — it's to keep your voice while reclaiming your evenings."
    columns: ["Dimension", "Manual", "Agent-operated (this SOP)"]
    rows:
      - ["Time cost", "Hours/week", "Minutes of review"]
      - ["Voice", "Yours", "Yours (persona-calibrated)"]
      - ["Fabricated stats", "Human error", "Blocked by SOURCE-INDEX"]
      - ["Consistency", "Drops when busy", "Daily, scheduled"]
  donts:
    title: "Anti-patterns (where AI Twitter goes wrong)"
    items:
      - "Letting the agent write without persona calibration — instant bot smell."
      - "No fact-source database — fabricated numbers destroy trust."
      - "Skipping pre-publish QC — one bad auto-post undoes months."
      - "Optimizing for volume over the archetypes that actually perform."
  faqs:
    - q: "Can an AI agent really post in my voice?"
      a: "Yes, with persona calibration — a voice guide, expression rules, and a dead-opener blacklist — validated by a triple-translation test before publishing. The case study grew a real account +60% in 45 days, fully agent-operated, without sounding like a bot."
    - q: "How does it avoid making up statistics?"
      a: "A fact-source database (SOURCE-INDEX) holds every traceable fact. The agent is constrained to cite only numbers that exist in the index, so it can't fabricate."
    - q: "Is it safe to let an agent post automatically?"
      a: "Only with rails: six hard safety rules plus a pre-publish QC checklist (including a triple-translation test) gate every post. The point is consistency with your voice, not unattended risk."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars), from analysis of a 3,861-tweet dataset and a real +60%-in-45-days account."
