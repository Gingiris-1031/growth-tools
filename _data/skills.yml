    - ["Pre-launch interviews", "20–40"]
    - ["First-user channels", "4 (competitor / LinkedIn / Reddit / Fiverr)"]
    - ["Signup-to-paid gate (ToC AI / ToB AI)", "≥1.5% / 10-15%+"]
    - ["Teams taught vs. fully executed", "100-200+ taught → under 10 executed"]
    - ["Executor conversion after the quiet grind", "4-8%+"]
    - ["Angel round vs. post-traction Pre-A", "~400 meetings, 1 yr → $8M in 1 month"]
  howto:
    title: "The Phase 0–5 go-global sequence"
    steps:
      - name: "Phase 0–1 · Judge & research"
        text: "Decide if you're ready to go global, then tear down competitors — their positioning evolution, channels, and where their users complain."
      - name: "Phase 2 · Position & site"
        text: "Write the one-line position ([differentiator] + [vs known product] + for [user]) and build the loop: website, README, demo, docs, community, conversion path."
      - name: "Phase 3 · First 100 users"
        text: "Mine competitors' unhappy active users, do precise LinkedIn outreach by role/industry/geo, keyword-listen on Reddit/Twitter (\"alternative to\", \"looking for\"), and validate paid demand on Fiverr."
      - name: "Phase 4 · User interviews"
        text: "Run 20–40 interviews to confirm the must-have and the willingness to pay before scaling any channel."
      - name: "Phase 5 · Beta → growth asset"
        text: "Fire the 48-hour launch peak across all channels (two KOL waves), then immediately pivot the energy into conversion, content, community and SEO/GEO to compound it."
  compare:
    title: "Channel SOP at a glance"
    intro: "Each overseas channel plays a different role — don't run them all the same way."
    columns: ["Channel", "Role", "Key rule"]
    rows:
      - ["Open-source launch", "Credibility ignition", "48h burst; all entries → GitHub README"]
      - ["Product Hunt", "Badge + social proof", "It's a badge war, not a traffic war"]
      - ["Reddit", "Targeted community", "Lurk 1–2wk, 80/20, no cross-posting"]
      - ["SEO / GEO", "Long-term capture", "Alternative / use-case / comparison pages first"]
  donts:
    title: "Anti-patterns (where go-global fails)"
    items:
      - "Targeting broad instead of the narrowest paying user."
      - "Launching before a one-line position is crisp."
      - "Treating the launch peak as the finish line instead of the start of interviews + conversion."
      - "Cross-posting identical content across Reddit communities — fast ban."
  faqs:
    - q: "What's the right order to go global?"
      a: "Phase 0–5: judge readiness → competitor research → positioning + website → first 100 users → user interviews → beta-to-growth. The discipline is firing a 48-hour launch peak, then immediately pivoting to interviews and monetization rather than chasing more traffic."
    - q: "How do I get my first 100 overseas users?"
      a: "Four channels: mine competitors' unhappy active users, precise LinkedIn outreach by role/industry/geo, keyword-listen on Reddit/Twitter for \"alternative to\" intent, and validate paid demand on Fiverr-style marketplaces."
    - q: "What makes a strong one-line position?"
      a: "[differentiator] + [vs a known product] + for [specific user/use-case]. It borrows the known product's mental model while staking out your wedge — and it's the foundation every channel's copy reuses."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars, 30× Product Hunt #1), advisor to 150+ AI startups on going global."
    - q: "When is it safe to scale paid acquisition?"
      a: "Only after signup-to-paid conversion clears the gate — at least 1.5% for ToC AI (good products hit 6-8%), 10-15%+ for ToB AI. Of 100-200+ teams taught this, fewer than 10 fully executed; those reached 4-8%+ conversion. One ToC product hit ~$5,000 MRR on ~10K signups after six quiet months, then scaled and raised smoothly."
    - q: "How much should I localize per market?"
      a: "Use the 80/20 formula: 80% standardized SOP, 20% local adaptation — integrate the local ecosystem, align with local holidays, adapt to culture. And calibrate down: digital maturity in Southeast Asia (even the US/EU) is often lower than expected, while a 24-hour response time is itself a competitive weapon."
