    - q: "Reddit or Hacker News — which matters more?"
      a: "Both, differently. Reddit is the steady workhorse (2–3 posts/week → direct, repeatable star conversion). Hacker News is the spike (1–2 submissions/month, 200–500 stars per successful post). You need the steady base plus the spikes."
    - q: "How do I turn users into contributors?"
      a: "Run a ladder: label 3–5 Good First Issues weekly with clear scope and mentor responses, reply to PRs within 24h, and promote contributors (Regular → Core → Maintainer) with public Contributor Spotlights."
