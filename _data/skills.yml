- slug: product-hunt-launch
  hf: gingiris-launch
  install: Gingiris-1031/gingiris-launch
  title: "Product Hunt Launch Playbook — Win #1 of the Day | Gingiris"
  h1: "Product Hunt Launch Playbook — Win #1 of the Day"
  tagline: "The 14-day operating timeline behind 30+ Product Hunt #1 daily wins."
  meta_description: "Product Hunt launch playbook: the T-14 → T-0 → T+7 timeline, hunter selection matrix, 6 maker-comment templates, realistic upvote benchmarks, anti-shadowban rules. From 30+ PH #1 wins."
  keywords: "product hunt launch playbook, how to win product hunt, hunter selection, maker comment, first comment, launch day timeline, product of the day, upvotes, GTM sequencing"
  software_description: "Multi-channel product launch playbook distilled from 30+ Product Hunt #1 daily wins and 150+ AI startup consultations. Covers the T-14 → T-0 → T+7 operating timeline, hunter selection matrix, 6 maker-comment archetypes, launch-day comment cadence, anti-shadowban rules, and second-wave coordination."
  app_category: BusinessApplication
  what: "Only ~10% of Product Hunt submissions ever get featured. The teams that win rarely have the best product that day — they have the best <strong>timing, comment cadence, and pre-seeded audience</strong>. This is the exact 14-day operating timeline used to coach 30+ #1 daily launches across 150+ AI startups."
  takeaways:
    - "Launch is a <strong>sequence, not an event</strong> — the 14-day run-up decides the day, not the product."
    - "Post at <strong>00:01 PST</strong>, maker comment by 00:15, reply in batches every 30 min — and <strong>never beg for upvotes</strong> (fast shadowban)."
    - "Pick the hunter on <strong>activity, not follower count</strong>. A 50k-follower hunter who hasn't hunted in 6 months is worse than an active 1k one."
    - "<strong>#2–#3 is still a win</strong> — forcing #1 with farmed upvotes risks the whole launch."
  stats:
    - ["Product Hunt #1 launches coached", "30+"]
    - ["AFFiNE GitHub stars driven", "60,000+"]
    - ["GitHub Trending appearances", "28× in 5 months"]
    - ["AI startups consulted on launch", "150+"]
    - ["Typical launch-day upvote uplift", "3–5× vs. uncoordinated"]
  howto:
    title: "How to launch on Product Hunt — the 14-day timeline"
    steps:
      - name: "T-14 · Prep"
        text: "Get the landing page, pricing and FAQ live, gather ≥100 early users + an email list, pick ONE hunter, and prepare 3 gallery images (1270×760) plus a 30-second demo video."
      - name: "T-7 to T-2 · Warm-up"
        text: "Post a \"we're launching, AMA\" in the PH discussion board. Tease on X / LinkedIn / Reddit WITHOUT linking the launch page (don't leak the traffic). Confirm the hunter's timezone and the 00:01 PST post time."
      - name: "T-1 · Final check"
        text: "Lock every asset. Draft the maker first comment (under 500 words, story-driven). Prepare 10 FAQ reply templates and ping 10–20 core supporters for tomorrow morning."
      - name: "T-0 · Launch day"
        text: "00:01 PST the hunter posts → 00:15 you post the maker first comment → reply in batches every 30 minutes (never solicit upvotes) → 14:00 PST push the second wave (mailing list + community) → 23:00 PST post a thank-you."
      - name: "T+1 to T+7 · Momentum"
        text: "Reply to every comment including the critical ones. Turn the Featured screenshot + numbers into a case study, set the \"how we won\" post as canonical, and import every upvoter email into your user pool."
  compare:
    title: "Realistic launch-day expectations"
    intro: "Honest benchmarks beat hype — and cherry-picked numbers cost you AI-search citations. Calibrate against these before launch day."
    columns: ["Outcome", "Upvotes", "Placement"]
    rows:
      - ["Poor", "50–100", "—"]
      - ["Average", "200–400", "Top 10"]
      - ["Good", "500–800", "Top 5"]
      - ["Great", "800+", "Product of the Day"]
  donts:
    title: "Anti-patterns (the things that sink launches)"
    items:
      - "Still changing the product on launch day — flaky demos kill conversion."
      - "Friends/family farming upvotes — Product Hunt shadowbans fast."
      - "External links in the first comment — triggers review demotion."
      - "Forgetting mobile screenshots — 40% of traffic is mobile."
      - "Treating the maker comment as a feature list instead of a story."
  faqs:
    - q: "Is this different from generic launch checklists I find on Google?"
      a: "Yes. Most launch guides are written by people who have never launched anything. This is written by someone who has launched 30+ products to #1 and coached 150+ startups — exact DM scripts, timing windows, and per-platform community rules."
    - q: "Does this work for non-AI products?"
      a: "The frameworks apply broadly, but the examples are tuned for AI/developer tools. Physical products and service businesses see limited success on Product Hunt; for consumer apps pair it with the ASO &amp; App Cold Start playbook."
    - q: "Do I need a famous hunter?"
      a: "No. Self-hunting is fine. If you do use a hunter, pick one with a successful hunt in the last 30 days in an adjacent domain — activity beats raw follower count every time."
    - q: "What if I don't have a big existing audience?"
      a: "That's exactly what this playbook addresses. The KOL outreach and hunter-coordination sections are built specifically for founders launching from zero platform."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — former cofounder/COO of AFFiNE (60K+ GitHub stars, Forbes Asia 30 Under 30). Coached 30+ Product Hunt #1 launches and advised 150+ AI startups on go-to-market."
  related:
    - ["Open-Source Marketing — 0 to 60K GitHub Stars", "/skills/open-source-marketing/"]
    - ["B2B SaaS Growth — PLG vs SLG to $10M ARR", "/skills/b2b-saas-growth/"]
    - ["SEO &amp; GEO Dual-Engine Playbook", "/skills/seo-geo/"]

- slug: b2b-saas-growth
  hf: gingiris-b2b-growth
  install: Gingiris-1031/gingiris-b2b-growth
  title: "B2B SaaS Growth Playbook — PLG vs SLG to $10M ARR | Gingiris"
  h1: "B2B SaaS Growth — PLG vs SLG Playbook"
  tagline: "Diagnose whether your problem is distribution, pricing, or PMF — then walk the staged path to $10M ARR."
  meta_description: "B2B SaaS growth playbook: PLG vs SLG selection by ACV and sales cycle, the 5-stage path to $10M ARR, NRR discipline, affiliate &amp; channel motion. From 8 case studies incl. HeyGen, Deel, Vercel."
  keywords: "B2B SaaS growth, PLG vs SLG, product-led growth, sales-led growth, SaaS pricing, ARR growth, NRR, enterprise sales, PMF validation, affiliate channel"
  software_description: "B2B SaaS growth playbook covering the path from $0 to $10M ARR across 8 documented case studies (HeyGen, Deel, Vercel, Supabase, AWS, Manus, Devin, AFFiNE). Diagnoses PLG vs SLG motion by ACV and sales cycle, the 5-stage ARR path, NRR discipline, affiliate/channel design, and enterprise tiering."
  app_category: BusinessApplication
  what: "&quot;People like it but revenue isn't growing&quot; is rarely one problem. It's usually a <strong>mis-matched motion</strong> — a PLG product run with an SLG playbook, or vice versa. This playbook diagnoses the motion by ACV and sales cycle, then walks the 5-stage path from $0 to $10M ARR across 8 documented case studies."
  takeaways:
    - "Stalled revenue is usually a <strong>mis-matched motion</strong>, not a product problem — fix the motion first."
    - "Choose by economics: <strong>ACV &lt; $1k + &lt;1-week cycle → PLG</strong>; <strong>ACV &gt; $10k + &gt;1-month cycle → SLG</strong>."
    - "Watch <strong>NRR, not just ARR</strong>. NRR &lt; 100% is a leaking bucket no amount of new logos fixes."
    - "<strong>Don't pour paid acquisition in before PMF</strong> — you burn cash 10× faster than you learn."
  stats:
    - ["AI startups consulted on B2B growth", "150+"]
    - ["Case studies with documented outcomes", "8"]
    - ["Average time to PMF (coached companies)", "4–9 months"]
    - ["PLG-to-SLG transition success rate", "70%+ when timed right"]
  howto:
    title: "The 5-stage path from $0 to $10M ARR"
    steps:
      - name: "Pre-PMF · $0–$100k"
        text: "Run 10–30 user interviews and confirm the must-have before anything else. Do not buy traffic yet — you'll burn cash faster than you learn."
      - name: "Early PMF · $100k–$1M"
        text: "Invest in 1–2 channels deeply rather than spraying. Find the one repeatable acquisition motion and double down before adding a second."
      - name: "Growth · $1M–$5M"
        text: "Add affiliate and integration partners; if PLG, layer in sales-assist for the larger accounts that self-serve can't close alone."
      - name: "Scale · $5M–$10M"
        text: "Stand up an enterprise team, earn compliance (SOC 2), and accelerate channel partnerships. Split contracts into startup / mid-market / enterprise tiers."
      - name: "Ecosystem · $10M+"
        text: "Open a platform and distribute through investors and agencies. Growth now compounds through partners, not just direct sales."
  compare:
    title: "PLG vs SLG — pick your motion"
    intro: "Don't copy a logo's playbook — match the motion to your deal economics. Decide by ACV and sales-cycle length:"
    columns: ["Signal", "Motion", "Reference"]
    rows:
      - ["ACV &lt; $1k/yr AND decision &lt; 1 week", "PLG", "Vercel, Supabase"]
      - ["ACV &gt; $10k/yr AND decision &gt; 1 month", "SLG", "Snowflake, Databricks"]
      - ["In between", "PLG-to-SLG hybrid", "HeyGen, Deel"]
  donts:
    title: "Anti-patterns (where B2B SaaS leaks revenue)"
    items:
      - "Paid acquisition before PMF — cash burns 10× faster than learning."
      - "Forcing PLG → SLG at $1M just because — Vercel held PLG to $100M."
      - "Watching ARR while ignoring NRR — under 100% is a leaking bucket."
      - "One contract template for everyone — split startup / mid-market / enterprise."
      - "B2C hype words (&quot;amazing&quot;, &quot;magical&quot;) instead of CFO-friendly ROI proof."
  faqs:
    - q: "What's the best growth motion for an AI SaaS in 2026 — PLG or SLG?"
      a: "It depends on ACV and sales cycle. Under $5k ACV with a &lt;30-day cycle → start PLG. Above $20k ACV or a &gt;60-day cycle → you need SLG earlier than you think. The playbook has a decision tree with specific thresholds."
    - q: "When should I hire my first SDR?"
      a: "Not before you've closed 20 deals yourself as a founder. If you haven't personally sold it, an SDR can't sell it either. The playbook covers the exact signals to look for first."
    - q: "How do I build an affiliate channel without it becoming a spam network?"
      a: "Partner quality &gt; partner quantity. The playbook covers how HeyGen and Deel vetted affiliate partners, set commission structures, and designed co-marketing that drives real revenue."
    - q: "What's the single most-missed B2B metric?"
      a: "NRR (net revenue retention). Teams obsess over new ARR while NRR quietly sits below 100% — a leaking bucket. The playbook treats NRR as the primary health metric above raw ARR."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — former cofounder/COO of AFFiNE (60K+ GitHub stars, Forbes Asia 30 Under 30). Advised 150+ AI startups on B2B growth, with 8 documented case studies."
  related:
    - ["Product Hunt Launch Playbook — Win #1 of the Day", "/skills/product-hunt-launch/"]
    - ["SEO &amp; GEO Dual-Engine Playbook", "/skills/seo-geo/"]
    - ["Open-Source Marketing — 0 to 60K GitHub Stars", "/skills/open-source-marketing/"]

- slug: open-source-marketing
  hf: gingiris-opensource
  install: Gingiris-1031/gingiris-opensource
  title: "Open-Source Marketing — 0 to 60K GitHub Stars | Gingiris"
  h1: "Open-Source Marketing — GitHub Stars Growth System"
  tagline: "The staged decision framework used to take AFFiNE from 0 to 60K GitHub stars."
  meta_description: "Open-source marketing playbook: pre-launch readiness, Show HN / Reddit / Product Hunt sequencing, 6-month growth loop, anti-star-farming. The system that took AFFiNE 0 → 60K stars (10K in 43 days)."
  keywords: "open source marketing, GitHub stars growth, Show HN, Hacker News launch, Reddit OSS launch, developer marketing, README optimization, GitHub Trending, dev.to, anti star farming"
  software_description: "Open-source go-to-market system covering pre-launch readiness, the Show HN / Reddit / Product Hunt launch sequence, and a 6-month growth loop. Battle-tested taking AFFiNE 0 → 60K GitHub stars (10K in 43 days, 28 GitHub Trending appearances) plus 150+ dev-tool consultations."
  app_category: DeveloperApplication
  what: "Stars don't come from a great repo — they come from <strong>a great repo placed in front of the right developers, in the right order</strong>. This is the exact staged decision framework used to take AFFiNE from 0 to 60K stars, with 10K reached in 43 days."
  takeaways:
    - "Stars follow <strong>placement and order</strong>, not repo quality alone — sequence the channels."
    - "<strong>English &gt; multilingual &gt; Chinese-only</strong>: launching an English project to Chinese communities first wastes your best shot."
    - "<strong>Show HN is not a one-shot</strong> — Tuesday 9am ET or Saturday, then engage every comment for the full day."
    - "<strong>Never farm stars</strong> — GitHub detects it fast and the penalty is disappearing from search."
  stats:
    - ["AFFiNE GitHub stars (24 months)", "60,000+"]
    - ["Time to first 10K stars", "43 days"]
    - ["GitHub Trending appearances", "28×"]
    - ["Dev-tool startups advised", "150+"]
  howto:
    title: "The 3-stage open-source growth framework"
    steps:
      - name: "Stage 1 · Pre-launch (T-30 → T-0)"
        text: "Get the README English-first and readable in under 3 seconds, ship a captioned 60-second demo, choose your license deliberately (MIT / Apache-2 / AGPL each carry traps), line up 3–5 early contributors, and open an English-first Discord or Telegram."
      - name: "Stage 2 · Launch (T-0 → T+14)"
        text: "Run the Product Hunt sequence, post Show HN (Tuesday 9am ET or Saturday), seed 3 relevant subreddits, publish deep technical posts on dev.to / Zenn / CSDN, and line up 3–5 KOLs (activity beats follower count)."
      - name: "Stage 3 · Growth (T+14 → T+180)"
        text: "Ship one technical blog per week, turn GitHub Issues into FAQ content, send a monthly update to the mailing list + Discord, and localize for Japan/Korea first when going global."
      - name: "Sustain · the monthly loop"
        text: "Keep a 300-stars/month cadence: weekly content, Reddit 2–3×/week, a monthly AMA, and 10+ Good First Issues so contributors compound the growth."
  compare:
    title: "Launch channels — what each is good for"
    intro: "Sequence channels to their strengths; don't spray the same post everywhere on day one."
    columns: ["Channel", "Best for", "Note"]
    rows:
      - ["Show HN", "Credibility spike + dev traffic", "Tue 9am ET / Sat; engage all day"]
      - ["Reddit (3 subs)", "Targeted developer reach", "Post once per sub, never drive-by"]
      - ["Product Hunt", "Broad visibility + social proof", "Run the dedicated launch sequence"]
      - ["dev.to / Zenn / CSDN", "Long-tail SEO + discovery", "Deep technical posts, weekly"]
  donts:
    title: "Anti-patterns (the things that get you un-discovered)"
    items:
      - "Farming stars — GitHub detects it fast; the penalty is disappearing from search."
      - "Posting to Reddit once and leaving — communities resent it; high ban risk."
      - "Too many emojis / badges in the README — lowers credibility."
      - "Launching an English project to Chinese communities first — wrong order, wasted shot."
  faqs:
    - q: "How long does it realistically take to reach 10K stars?"
      a: "AFFiNE hit 10K in 43 days from public launch with this sequence (README readiness → 3-niche seeding → Show HN → 48-hour star push → sustained content). Generic launches without structure typically take 6–18 months for the same milestone."
    - q: "How do I get on GitHub Trending?"
      a: "Coordinate a 48-hour star push from warm contacts + community alongside a Show HN or Reddit post. The algorithm rewards star velocity, not absolute count — 150–300 stars in 48 hours usually lands a niche-language list."
    - q: "Which license should I pick?"
      a: "Choose deliberately — MIT maximizes adoption, Apache-2 adds patent protection, AGPL protects against closed-source forks but scares some enterprises. Decide based on whether you plan to monetize a hosted version."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — former cofounder/COO of AFFiNE (60K+ GitHub stars), who led its organic 0 → 60K growth and advised 150+ dev-tool startups."
  related:
    - ["Product Hunt Launch Playbook — Win #1 of the Day", "/skills/product-hunt-launch/"]
    - ["SEO &amp; GEO Dual-Engine Playbook", "/skills/seo-geo/"]
    - ["B2B SaaS Growth — PLG vs SLG to $10M ARR", "/skills/b2b-saas-growth/"]

- slug: seo-geo
  hf: gingiris-seo-geo
  install: Gingiris-1031/gingiris-seo-geo
  title: "SEO & GEO Dual-Engine Playbook — Rank on Google AND Get Cited by AI | Gingiris"
  h1: "SEO &amp; GEO Dual-Engine Playbook"
  tagline: "Rank on Google AND get cited by ChatGPT, Perplexity, Claude and Gemini — with one content system."
  meta_description: "SEO &amp; GEO playbook: BOFU-first keyword funnel, E-E-A-T founder voice, JSON-LD schema, IndexNow, comparison pages. Win Google rankings AND AI-search citations. From AFFiNE (60K stars) + 150 startups."
  keywords: "SEO, GEO, generative engine optimization, AI search optimization, ChatGPT SEO, Perplexity citation, JSON-LD schema, IndexNow, E-E-A-T, comparison pages, keyword funnel"
  software_description: "Dual-engine playbook to rank on Google AND get cited by AI search (ChatGPT, Perplexity, Claude, Gemini). Covers the BOFU-first keyword funnel, an E-E-A-T founder-voice writing system, JSON-LD schema templates, IndexNow setup, and the comparison-page SOP. Battle-tested at AFFiNE (60K stars in 24 months) and across 150+ startup consultations."
  app_category: DeveloperApplication
  what: "Google ranking and AI-search citation are <strong>two different games with one content system</strong>. SEO rewards backlinks + keywords; GEO rewards structured data + E-E-A-T authenticity. This playbook runs both engines from the same content — so a single page earns Google rankings and shows up inside ChatGPT/Perplexity/Claude answers."
  takeaways:
    - "<strong>Start from BOFU</strong> — do high-intent terms (pricing, comparisons) first; they convert highest, then work up to educational content."
    - "<strong>Authentic voice IS the best E-E-A-T</strong> — don't let AI write like AI; founder voice + real numbers + first-hand stories."
    - "<strong>Structured = citable</strong> — Key-Stats tables, FAQ schema and comparison matrices are what AI engines extract and quote."
    - "<strong>IndexNow is GEO infrastructure</strong> — push updates to Bing/AI search in seconds instead of waiting for crawlers."
  stats:
    - ["Months to 60K stars (AFFiNE, SEO-driven)", "24"]
    - ["Startup consultations behind the system", "150+"]
    - ["Core principles", "5"]
    - ["Engines optimized from one content set", "Google + 4 AI"]
  howto:
    title: "The 5 core principles of SEO + GEO"
    steps:
      - name: "1 · Start from BOFU, work upward"
        text: "Build the highest-intent, highest-converting keywords first (pricing, comparisons, alternatives), then expand up the funnel to educational content. Revenue-adjacent pages compound fastest."
      - name: "2 · Authentic voice is the best E-E-A-T"
        text: "Don't let AI write like AI. Use the founder's voice, real numbers, and first-hand stories — authenticity signals are what both Google E-E-A-T and AI engines reward."
      - name: "3 · Structured = citable"
        text: "Add Key-Stats tables, FAQ schema, and comparison matrices to every page. Structured, answer-first content is exactly what AI engines extract and cite."
      - name: "4 · IndexNow is GEO infrastructure"
        text: "Wire up IndexNow so every content update pings Bing and AI search in seconds. Don't wait weeks for organic crawl when you've shipped something citable."
      - name: "5 · Comparison pages are SEO gold mines"
        text: "Build one dedicated page per competitor (\"X vs Y\", \"X alternatives\") to capture decision-stage users — these are the highest-ROI pages for both SEO and GEO."
  compare:
    title: "SEO vs GEO — two engines, one content system"
    intro: "Optimize for both at once: the same page should rank on Google and be quotable by AI search."
    columns: ["Dimension", "SEO (traditional)", "GEO (AI search)"]
    rows:
      - ["Goal", "Google / Bing rankings", "Cited inside AI answers"]
      - ["Core signal", "Backlinks + keyword match", "Structured data + E-E-A-T"]
      - ["Content format", "H2/H3 + long-tail coverage", "Direct answers + tables + FAQ schema"]
      - ["Technical", "XML sitemap + Core Web Vitals", "IndexNow + AI-crawler-open robots.txt"]
  donts:
    title: "Anti-patterns (what kills SEO + GEO)"
    items:
      - "AI-sounding generic copy — no E-E-A-T signal, no citation."
      - "Cherry-picked comparison rows — erodes trust and costs you AI citations."
      - "Starting from TOFU educational content — slow, low-converting; do BOFU first."
      - "Shipping content with no schema — invisible to AI extraction."
  faqs:
    - q: "What is GEO and how is it different from SEO?"
      a: "GEO (Generative Engine Optimization) is optimizing to be cited inside AI-search answers (ChatGPT, Perplexity, Claude, Gemini), where the signals are structured data + E-E-A-T authenticity. SEO targets Google/Bing rankings via backlinks + keywords. This playbook wins both from one content set."
    - q: "What's the single highest-ROI thing I can do?"
      a: "Build comparison pages — one dedicated \"X vs Y\" or \"X alternatives\" page per competitor. They capture decision-stage users and are equally strong for Google ranking and AI citation."
    - q: "Do I really need IndexNow?"
      a: "For GEO, yes — it's the infrastructure that pushes updates to Bing and AI search in seconds instead of waiting on crawl cycles. It's a one-time setup that compounds on every publish."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — former cofounder/COO of AFFiNE (60K GitHub stars in 24 months, largely SEO-driven) and advisor to 150+ startups on search and AI-search growth."
  related:
    - ["SEO/GEO Agent Operations SOP", "/skills/seo-geo-agent/"]
    - ["Open-Source Marketing — 0 to 60K GitHub Stars", "/skills/open-source-marketing/"]
    - ["B2B SaaS Growth — PLG vs SLG to $10M ARR", "/skills/b2b-saas-growth/"]

- slug: aso-growth
  hf: gingiris-aso-growth
  install: Gingiris-1031/gingiris-aso-growth
  title: "ASO & App Cold-Start Playbook — Store Optimization + UGC Matrix | Gingiris"
  h1: "ASO &amp; App Cold-Start Playbook"
  tagline: "From App Store keyword ranking to a UGC creator matrix — the organic-first cold-start system."
  meta_description: "ASO playbook: App Store &amp; Google Play keyword optimization, the Organic-First cold-start method, UGC creator matrix, TikTok/Reels/Shorts strategy, and platform algorithm differences."
  keywords: "ASO, app store optimization, Google Play optimization, app cold start, UGC creator matrix, TikTok marketing, Instagram Reels, YouTube Shorts, mobile user acquisition, organic first"
  software_description: "App Store Optimization and cold-start playbook: store-listing and keyword optimization for App Store and Google Play, the Organic-First cold-start method, UGC creator-matrix operations, multi-platform short-video strategy (TikTok / Reels / Shorts), and App Store vs Google Play algorithm differences."
  app_category: BusinessApplication
  what: "App growth starts <strong>organic-first</strong>: run your own accounts, find a Winning Format, then hand it to a UGC creator matrix and only then pour paid behind what already works. This playbook covers store-listing ASO, the cold-start method, and the platform-specific content strategy that feeds it."
  takeaways:
    - "<strong>Organic First</strong>: find a Winning Format yourself BEFORE handing it to creators or buying ads."
    - "<strong>App Store ≠ Google Play</strong>: App Store rewards precise metadata; Google Play reads long descriptions AND Android Vitals."
    - "Match the platform to the audience — <strong>TikTok 13–18, Instagram 18–25, YouTube Shorts 25–35</strong> (highest paid conversion)."
    - "<strong>The first 3 seconds</strong> decide a short video — hook hard or lose the view."
  stats:
    - ["Cold-start principle", "Organic First"]
    - ["Short-video platforms covered", "TikTok / Reels / Shorts"]
    - ["UGC base price per piece", "~$20 + view bonuses"]
    - ["App Store keyword field limit", "100 chars"]
  howto:
    title: "The Organic-First cold-start method"
    steps:
      - name: "1 · Run your own accounts"
        text: "Operate the social accounts yourself first and test every content format hands-on — you can't outsource taste you haven't developed."
      - name: "2 · Find the Winning Format"
        text: "Iterate until you find the repeatable format that consistently produces hits. This Winning Format is the asset, not any single video."
      - name: "3 · Hand it to a UGC creator matrix"
        text: "Give the Winning Format to vetted creators and build the management layer — contracts, payment, and a data dashboard. Base pay ~$20/piece plus view-based bonuses ($20 at 10K, $50 at 100K, $200 at 1M)."
      - name: "4 · Pour paid behind what works"
        text: "Promote the best-performing organic pieces as ad creative — Meta (Facebook + Instagram) first. Never pay to amplify something organic hasn't already validated."
  compare:
    title: "App Store vs Google Play — algorithm differences"
    intro: "The two stores reward different things; the same listing won't optimize for both."
    columns: ["Dimension", "App Store", "Google Play"]
    rows:
      - ["Algorithm core", "Precise metadata match", "Text understanding + tech performance"]
      - ["Keyword strategy", "Concise, weight-first", "Comprehensive, density-first"]
      - ["Long description", "No effect on ranking", "Critical ranking factor"]
      - ["Technical signal", "Indirect", "Android Vitals directly affects rank"]
  donts:
    title: "Anti-patterns (where app cold-starts fail)"
    items:
      - "Buying ads before finding a Winning Format — you scale something that doesn't convert."
      - "Copy-pasting one listing across both stores — App Store and Google Play want opposite things."
      - "Ignoring the first 3 seconds of a short video — that's where retention is won or lost."
      - "Treating UGC as one-off gigs instead of a managed matrix with dashboards."
  faqs:
    - q: "What does \"Organic First\" actually mean?"
      a: "Run accounts and test formats yourself until you find a repeatable Winning Format, hand that format to a UGC creator matrix, and only then put paid spend behind the pieces that already performed organically. It de-risks acquisition spend."
    - q: "How should I price UGC creators?"
      a: "A base around $20 per piece plus view-based bonuses — roughly +$20 at 10K views, +$50 at 100K, +$200 at 1M. It aligns creator incentives with actual reach."
    - q: "Should I optimize App Store and Google Play the same way?"
      a: "No. App Store rewards precise, weight-first metadata and ignores the long description for ranking; Google Play reads the full long description and factors in Android Vitals performance. Optimize each separately."
