  software_description: "Full-cycle go-global SOP for AI products and SaaS covering Phase 0–5: pre-launch market judgment, competitor research, one-line positioning + website, the first 100 users, user interviews, and converting a launch peak into long-term growth assets via content, community, SEO and ecosystem."
  app_category: BusinessApplication
  what: "Going global isn't one launch — it's a <strong>sequence: find the narrowest paying user, nail a one-line position, build the conversion loop, fire a 48-hour credible traffic peak, then immediately pivot to interviews and monetization</strong>. This is the Phase 0–5 SOP that turns a single launch into a durable overseas asset."
  takeaways:
    - "Find the <strong>narrowest, most willing-to-pay user</strong> first — broad targeting kills cold-starts."
    - "Nail a one-line position: <strong>[differentiator] + [vs known product] + for [user/use-case]</strong>."
    - "A launch peak is <strong>48 hours</strong> — concentrate all channels, then immediately pivot to interviews + conversion."
    - "Reddit: <strong>lurk 1–2 weeks, 80% value / 20% product</strong>, never cross-post the same thing."
    - "Gate before scaling: <strong>ToC AI ≥1.5% / ToB 10-15%+ signup-to-paid</strong> — no ads, no PH, no influencers until you clear it."
    - "Going global is subtraction: <strong>80% standardized SOP + 20% local adaptation</strong> (ecosystem, holidays, culture)."
    - "Charge from <strong>day 0</strong> — even $1 plants the 'not free' expectation, and paying users give higher-quality feedback."
    - "Org ladder: one decision maker at ~3 people, full squad at 6-8, leader layer at 10-12 — <strong>revenue before headcount 8</strong>."
  stats:
