- slug: kol-outreach
  hf: gingiris-kol-outreach
  install: Gingiris-1031/gingiris-skills
  install_skill: gingiris-kol-outreach
  title: "KOL Outreach Skill: Creator Briefs and Attribution"
  h1: "KOL Outreach &amp; Influencer Marketing Playbook"
  tagline: "Creator outreach from discovery to ROI, with staged product testing and channel-by-channel response evidence."
  meta_description: "Build creator selection criteria, outreach drafts and deliverable briefs. Track replies, trials, completed testing and conversions as separate stages."
  keywords: "KOL outreach, influencer marketing, KOL pricing, creator partnership, micro-influencer, content package, UTM tracking, KOL ROI, Twitter thread pricing, YouTube sponsorship"
  software_description: "KOL outreach and influencer-marketing SOP from discovery to ROI tracking: a 3-tier KOL system, platform pricing benchmarks, content-package templates, draft-review process, payment timing, and UTM-based ROI measurement. Battle-tested across 200+ KOL campaigns at AFFiNE (60K stars). Also includes staged product-test invitations and channel-specific response tracking without universal reply-rate claims."
  app_category: BusinessApplication
  what: "Most influencer spend dies because there's no system — no tiering, no pricing benchmark, no UTM tracking. This is the <strong>6-step SOP from discovery to ROI</strong> used across 200+ KOL campaigns, including a 3-tier KOL model and per-platform pricing so you stop overpaying and start measuring."
  takeaways:
    - "Track willingness → invitation sent → actual use → completed test → feedback. Connection acceptance and stated interest are not product activation."
    - "Compare channel reply rates using recorded sends and replies over a defined period; do not assume one platform always performs better."
    - "<strong>1k–10k followers is the sweet spot</strong> — micro-KOLs convert far better than 100k+ accounts."
    - "<strong>Engagement &gt; follower count</strong>: require avg views / followers &gt; 10% and audience that matches your ICP."
    - "<strong>Every KOL gets a unique UTM</strong> — if you can't track it to at least a pageview, you can't compute ROI."
    - "<strong>Compute Channel CPM on a 10-post median</strong>, not the best post, to avoid paying on cherry-picked peaks."
    - "<strong>One video, 1–2 selling points.</strong> A 15–60s short can't carry 6–8 (each gets &lt;4 seconds) — scene-bind the hook to the creator's vertical instead."
    - "<strong>Pay + contract = fulfillment.</strong> Pure-commission and barter deals are where creators ghost; paid-and-contracted campaigns sustain 90%+ delivery rates (field ref: Superlinear, 100+ brands)."
    - "<strong>Counter at ~30% of the first quote</strong> and create peer momentum ('20+ creators are already in this campaign') — one over-priced creator came back and posted for free."
    - "<strong>Top creators can't be bought — they can be earned</strong>: a short monthly product-update email turned a no-sponsorship KOL into a free dedicated video in ~6 months."
    - "<strong>Escalate email to IM (WhatsApp/Telegram/LinkedIn) after 2-3 replies</strong> — the cheapest insurance against creator no-shows."
  stats:
    - ["KOL campaigns behind the SOP", "200+"]
    - ["Best-value follower range", "1k–10k"]
    - ["Min engagement rate", ">10%"]
    - ["Twitter thread benchmark", "$50–200"]
    - ["AI-assisted outreach throughput (field ref: Superlinear)", "20 → 80–100 creators/op/month"]
    - ["Paid-creator fulfillment rate (pay + contract model)", "90%+"]
    - ["Cheapest KOC deal that shipped (3k followers)", "$80"]
    - ["YouTube dedicated video floor (under 100k subs, self-reported)", "~$800-1,200"]
    - ["Counter-offer anchor vs first quote", "~30%"]
  howto:
    title: "The 6-step KOL outreach SOP"
    steps:
      - name: "1 · Shortlist & tier (L-4 weeks)"
        text: "Build a 3-tier list: Tier 1 ignition nodes (newsletter founders, top engineers, VCs — reach free via network), Tier 2 mid-tier KOLs 1k–200k (paid), Tier 3 micro-creators (templated / value swap). Vet on engagement and ICP fit, not follower count."
      - name: "2 · Price & connect (L-4 weeks)"
        text: "Benchmark before you negotiate: Twitter thread $50–200, TikTok $200–500, YouTube feature $600–1,500, LinkedIn post $2,000–8,000. Open with a personalized DM, not a templated blast."
      - name: "3 · Send the content package (L-3 weeks)"
        text: "Give creators a ready-to-use brief: hooks, key messages, do/don't, assets, and platform-specific guidance (e.g., TikTok 3-second hook, 15–60s, loop design)."
      - name: "4 · Review the draft (L-2 weeks)"
        text: "Check the draft against the brief and platform algorithm fit before anything publishes — fix weak hooks and missing CTAs now, not after it's live."
      - name: "5 · Pay (L-1 to L-Day)"
        text: "Release payment on the agreed schedule tied to publish, with clear deliverable terms — milestone payment protects both sides."
      - name: "6 · Monitor & review ROI (L-Day to L+1 week)"
        text: "Confirm on-time publish, activate engagement immediately, collect 24h/48h/72h screenshots, and compute ROI = (KOL-driven revenue − cost) / cost via the unique UTM."
  compare:
    title: "Platform pricing benchmarks"
    intro: "Rough per-post ranges so you can sanity-check quotes before negotiating."
    columns: ["Platform", "Format", "Benchmark"]
    rows:
      - ["Twitter / X", "1 thread", "$50–200"]
      - ["TikTok", "1 collaboration", "$200–500"]
      - ["YouTube", "Dedicated video", "$600–1,500"]
      - ["LinkedIn", "1 post", "$2,000–8,000"]
  donts:
    title: "Anti-patterns (where KOL budget leaks)"
    items:
      - "Chasing follower count over engagement and ICP fit."
      - "Templated cold blasts instead of personalized first contact."
      - "No unique UTM per KOL — you can't compute ROI you didn't track."
      - "Pricing on a single best post instead of a 10-post median."
  faqs:
    - q: "What size KOL gives the best ROI?"
      a: "Micro-KOLs in the 1k–10k follower range, with engagement (avg views / followers) above 10% and an audience matching your ICP. They convert far better per dollar than 100k+ accounts."
    - q: "How do I benchmark KOL pricing?"
      a: "Use rough per-post ranges — Twitter thread $50–200, TikTok $200–500, YouTube feature $600–1,500, LinkedIn $2,000–8,000 — and compute Channel CPM on a 10-post median, not the best-performing post."
    - q: "How do I actually measure KOL ROI?"
      a: "Give every KOL a unique UTM link, track at minimum to pageview, and compute ROI = (KOL-driven revenue − cost) / cost. Collect 24h/48h/72h performance screenshots for the post-mortem."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars), from 200+ KOL campaigns across launch and growth."
    - q: "How do I negotiate a KOL's first quote?"
      a: "Counter at roughly 30% of the quote and build campaign momentum — mention that 20+ creators are already in. Overseas creators are mostly individuals or small studios, so negotiate directly rather than through an agency. US-market YouTube above ~$2,000 for a sub-100k channel usually means you didn't negotiate."
    - q: "How do I win top-tier KOLs who don't take sponsorships?"
      a: "Creators who monetize via content or affiliate income ignore paid offers. Understand their business model, then send a short monthly what's-new email — they read even if they never reply. In one self-reported case, six months of updates converted into a free dedicated video."
    - q: "How do I stop a creator from ghosting after we agree on a deal?"
      a: "Move the conversation from email to WhatsApp, Telegram, or LinkedIn after 2-3 replies, and keep follow-up investment only for creators who reciprocate — treat one-way relationships as a stop signal."
  related:
    - ["UGC Matrix Growth Playbook", "/skills/ugc-matrix/"]
    - ["Product Hunt Launch Playbook — Win #1 of the Day", "/skills/product-hunt-launch/"]
    - ["Open-Source Marketing — 0 to 60K GitHub Stars", "/skills/open-source-marketing/"]
  updated: '2026-11-11'
  usage:
    inputs: Product, target market, creator criteria, budget and proposed deliverables.
    outputs: A creator shortlist rubric, outreach draft, deliverable brief and attribution checklist.
    prompt: Build a creator outreach plan for the supplied product. Separate reply, trial, completed testing and paid
      conversion; draft messages for review.
    example: A creator who replied positively is recorded as interested, not as a completed trial or an attributable sale.

