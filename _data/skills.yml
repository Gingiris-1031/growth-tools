    title: "How to build a UGC matrix"
    steps:
      - name: "1 · Recruit & tier creators"
        text: "Build two tiers: ~10 strategists who create new concepts and test directions, and ~70 executors who precisely replicate the winning scripts."
      - name: "2 · Design incentives"
        text: "Set incentives that reward both originating a winning format and faithfully scaling it — so strategists keep inventing and executors keep producing."
      - name: "3 · Run AI matrix accounts"
        text: "Operate a matrix of AI-assisted accounts to multiply output, maintaining account health and platform-policy compliance."
      - name: "4 · Two-step content strategy"
        text: "Step 1 grow followers with AI value content (tool lists, tips). Step 2 convert with Before/After use-case posts and real phone-shot demos."
