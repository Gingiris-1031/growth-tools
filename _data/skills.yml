- slug: competitor-research
  hf: competitor-research-playbook
  install: Gingiris-1031/competitor-research-playbook
  title: "Competitor Research & Growth Flywheel Playbook | Gingiris"
  h1: "Competitor Research &amp; Growth Flywheel Playbook"
  tagline: "Reverse-engineer how a competitor grew — Wayback teardown, propagation mapping, 6-stage flywheel scoring."
  meta_description: "Competitor research SOP: 4-step framework, 3-version Wayback website-evolution analysis, X/Twitter propagation-chain mapping, growth-flywheel 6-stage scoring, KOL identification. Incl. Lovable case."
  keywords: "competitor research, competitive analysis, growth flywheel, Wayback Machine, website teardown, Twitter propagation, KOL identification, market research, ICP analysis"
  software_description: "Systematic competitor-research SOP: a 4-step framework (website teardown → social media → traffic sources → ad spend), 3-version Wayback website-evolution analysis, X/Twitter propagation-chain mapping, growth-flywheel 6-stage scoring, and KOL identification. Battle-tested across 150+ AI startups including the Lovable launch case study."
  app_category: BusinessApplication
  what: "When a competitor blows up, the instinct is to copy their latest move — usually the wrong one. This playbook <strong>reverse-engineers the whole flywheel</strong>: how their website evolved, how the launch propagated, and which growth stages are actually strong — so you copy the system, not the symptom."
  takeaways:
    - "Work the <strong>4 steps in order</strong>: website → social media → traffic sources → ad spend."
    - "Read <strong>3 website versions via Wayback</strong> (V1 / Beta / Launch) to see how positioning evolved."
    - "Score the <strong>6-stage flywheel</strong> (Activation → Referral → Acquisition → Retention → Revenue → Product) to find the real strength."
    - "Content that travels: <strong>visual demo &gt; user story &gt; competitor comparison</strong> (validated ranking)."
  stats:
    - ["AI startups analyzed", "150+"]
    - ["Website versions compared", "3 (V1/Beta/Launch)"]
    - ["Flywheel stages scored", "6"]
    - ["Lovable launch-day impressions", "229K"]
  howto:
    title: "The 4-step competitor research framework"
    steps:
      - name: "1 · Website teardown (3 versions)"
        text: "Pull V1, Beta and Launch snapshots from the Wayback Machine and record, per version: one-line positioning, page length/structure, use cases, CTA/pricing, SEO changes, and which community channels launched when."
      - name: "2 · Social media teardown"
        text: "Use SimilarWeb to find their main traffic source, then deep-dive the right channel: official vs founder vs DevRel vs KOL accounts, posting cadence, and content-type mix."
      - name: "3 · Map the propagation chain"
        text: "Reconstruct the launch as 4 phases — internal ignition (hours) → ecosystem catalysis (1–2 days) → KOL detonation (2–3 days) → broad penetration (weeks) — and identify the traffic kings, topic starters, and mindset-shifters."
      - name: "4 · Score the growth flywheel"
        text: "Rate all six stages (Activation, Referral, Acquisition, Retention, Revenue, Product) strong-vs-weak using signals like Discord DAU, systematic user-story propagation, and clear free-to-paid triggers."
  compare:
    title: "Content effectiveness (validated ranking)"
    intro: "When mapping a competitor's launch, weight the content types that actually drove spread."
    columns: ["Rank", "Content type", "Why it travels"]
    rows:
      - ["🥇", "Visual demo (video/GIF)", "Strongest immediate impact"]
      - ["🥈", "Real user success story", "Most credible"]
      - ["🥉", "Competitor comparison", "Sparks discussion"]
      - ["4–5", "Stats / feature announcements", "Social currency / narrow reach"]
  donts:
    title: "Anti-patterns (where competitor research misleads)"
    items:
      - "Copying their latest tactic instead of the underlying flywheel."
      - "Only looking at the current site — you miss how positioning evolved."
      - "Analyzing every channel equally instead of their main traffic source."
      - "Ignoring which content actually propagated vs. what merely existed."
  faqs:
    - q: "How do I reverse-engineer a competitor's growth?"
      a: "Run the 4 steps in order — website teardown (3 Wayback versions), social-media channel analysis, traffic-source mapping, ad-spend — then score their 6-stage growth flywheel to find where the strength actually is."
    - q: "Which content types drive the most spread?"
      a: "Validated ranking: visual demos (video/GIF) > real user success stories > competitor comparisons > stats/feature announcements. Weight your teardown — and your own launch — toward the top of that list."
    - q: "What tools do I need?"
      a: "Wayback Machine for historical website snapshots, SimilarWeb for traffic-source distribution, and Semrush for SEO and ad-spend analysis."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars), from 150+ AI-startup competitive analyses including a full Lovable launch teardown."
  related:
    - ["AI Product / SaaS Go-Global SOP", "/skills/go-global/"]
    - ["SEO &amp; GEO Dual-Engine Playbook", "/skills/seo-geo/"]
    - ["Product Hunt Launch Playbook — Win #1 of the Day", "/skills/product-hunt-launch/"]

- slug: twitter-agent-ops
