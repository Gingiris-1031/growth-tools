      - ["Weekly blog / video", "8–12 / month", "Long-tail SEO discovery"]
      - ["Hackathon sponsorship", "As needed", "200–500 stars per event"]
  donts:
    title: "Anti-patterns (what stalls star growth)"
    items:
      - "Chasing one viral moment instead of a repeatable monthly cadence."
      - "Buying/farming stars — fast detection, removed from search."
      - "Ignoring PRs — a 24h+ first response kills contributor momentum."
      - "Spreading thin across every channel instead of weighting to Reddit + content."
