- slug: kol-outreach
  hf: gingiris-kol-outreach
  install: Gingiris-1031/gingiris-kol-outreach
  title: "KOL Outreach & Influencer Marketing Playbook — Discovery to ROI | Gingiris"
  h1: "KOL Outreach &amp; Influencer Marketing Playbook"
  tagline: "The 6-step SOP from discovery to ROI — battle-tested across 200+ KOL campaigns at AFFiNE."
  meta_description: "KOL outreach playbook: 3-tier KOL system, platform pricing benchmarks, content-package templates, draft review, UTM ROI tracking. The 6-step SOP from 200+ campaigns at AFFiNE (60K stars)."
  keywords: "KOL outreach, influencer marketing, KOL pricing, creator partnership, micro-influencer, content package, UTM tracking, KOL ROI, Twitter thread pricing, YouTube sponsorship"
  software_description: "KOL outreach and influencer-marketing SOP from discovery to ROI tracking: a 3-tier KOL system, platform pricing benchmarks, content-package templates, draft-review process, payment timing, and UTM-based ROI measurement. Battle-tested across 200+ KOL campaigns at AFFiNE (60K stars)."
  app_category: BusinessApplication
  what: "Most influencer spend dies because there's no system — no tiering, no pricing benchmark, no UTM tracking. This is the <strong>6-step SOP from discovery to ROI</strong> used across 200+ KOL campaigns, including a 3-tier KOL model and per-platform pricing so you stop overpaying and start measuring."
  takeaways:
    - "<strong>1k–10k followers is the sweet spot</strong> — micro-KOLs convert far better than 100k+ accounts."
    - "<strong>Engagement &gt; follower count</strong>: require avg views / followers &gt; 10% and audience that matches your ICP."
    - "<strong>Every KOL gets a unique UTM</strong> — if you can't track it to at least a pageview, you can't compute ROI."
    - "<strong>Compute Channel CPM on a 10-post median</strong>, not the best post, to avoid paying on cherry-picked peaks."
  stats:
    - ["KOL campaigns behind the SOP", "200+"]
    - ["Best-value follower range", "1k–10k"]
    - ["Min engagement rate", "&gt;10%"]
    - ["Twitter thread benchmark", "$50–200"]
  howto:
    title: "The 6-step KOL outreach SOP"
    steps:
      - name: "1 · Shortlist & tier (L-4 weeks)"
        text: "Build a 3-tier list: Tier 1 ignition nodes (newsletter founders, top engineers, VCs — reach free via network), Tier 2 mid-tier KOLs 1k–200k (paid), Tier 3 micro-creators (templated / value swap). Vet on engagement and ICP fit, not follower count."
      - name: "2 · Price & connect (L-4 weeks)"
        text: "Benchmark before you negotiate: Twitter thread $50–200, TikTok $200–500, YouTube feature $600–1,500, LinkedIn post $2,000–8,000. Open with a personalized DM, not a templated blast."
      - name: "3 · Send the content package (L-3 weeks)"
        text: "Give creators a ready-to-use brief: hooks, key messages, do/don't, assets, and platform-specific guidance (e.g., TikTok 3-second hook, 15–60s, loop design)."
      - name: "4 · Review the draft (L-2 weeks)"
        text: "Check the draft against the brief and platform algorithm fit before anything publishes — fix weak hooks and missing CTAs now, not after it's live."
      - name: "5 · Pay (L-1 to L-Day)"
        text: "Release payment on the agreed schedule tied to publish, with clear deliverable terms — milestone payment protects both sides."
      - name: "6 · Monitor & review ROI (L-Day to L+1 week)"
        text: "Confirm on-time publish, activate engagement immediately, collect 24h/48h/72h screenshots, and compute ROI = (KOL-driven revenue − cost) / cost via the unique UTM."
  compare:
    title: "Platform pricing benchmarks"
    intro: "Rough per-post ranges so you can sanity-check quotes before negotiating."
    columns: ["Platform", "Format", "Benchmark"]
    rows:
      - ["Twitter / X", "1 thread", "$50–200"]
      - ["TikTok", "1 collaboration", "$200–500"]
      - ["YouTube", "Dedicated video", "$600–1,500"]
      - ["LinkedIn", "1 post", "$2,000–8,000"]
  donts:
    title: "Anti-patterns (where KOL budget leaks)"
    items:
      - "Chasing follower count over engagement and ICP fit."
      - "Templated cold blasts instead of personalized first contact."
      - "No unique UTM per KOL — you can't compute ROI you didn't track."
      - "Pricing on a single best post instead of a 10-post median."
  faqs:
    - q: "What size KOL gives the best ROI?"
      a: "Micro-KOLs in the 1k–10k follower range, with engagement (avg views / followers) above 10% and an audience matching your ICP. They convert far better per dollar than 100k+ accounts."
    - q: "How do I benchmark KOL pricing?"
      a: "Use rough per-post ranges — Twitter thread $50–200, TikTok $200–500, YouTube feature $600–1,500, LinkedIn $2,000–8,000 — and compute Channel CPM on a 10-post median, not the best-performing post."
    - q: "How do I actually measure KOL ROI?"
      a: "Give every KOL a unique UTM link, track at minimum to pageview, and compute ROI = (KOL-driven revenue − cost) / cost. Collect 24h/48h/72h performance screenshots for the post-mortem."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars), from 200+ KOL campaigns across launch and growth."
  related:
