  meta_description: "Design contributor roles, onboarding, deliverables and incentives. Separate volunteer ambassadors, paid creators and code contributors before recruitment."
  keywords: "ambassador program, community building, community-led growth, DevRel, Bronze to Platinum, incentive framework, community operations, user retention, KOL cultivation"
  software_description: "Community and ambassador operations with three contribution tracks: volunteers, paid tutorial creators and code contributors. Includes recruitment, incentives, retention, deliverables, attribution and settlement review; volunteer case studies are scoped to their original context."
  app_category: BusinessApplication
  what: "Choose a contributor track before designing incentives: <strong>volunteer community ambassadors, paid tutorial creators, or code contributors</strong>. Agree on selection evidence, deliverables, compensation, attribution and review dates. The earlier volunteer-program examples remain useful in their original context."
  takeaways:
    - "Record role, selection evidence, deliverable, compensation, attribution, settlement rules and review date; example fees are not standard rates."
    - "Use the <strong>six readiness checks as references for a scaled community program</strong>. A small tutorial pilot needs a usable workflow and capacity to support the users it brings."
    - "Recruit on <strong>A+B: event-organizing ability AND content output</strong> — quality over quantity (only ~25% stay active)."
    - "The strongest incentives are <strong>founder access + helping ambassadors become KOLs</strong>, not swag."
    - "Four tiers by annual points: <strong>Bronze → Silver → Gold → Platinum</strong>."
    - "For a scaled volunteer program, assess <strong>internal usage, product quality and organic advocacy</strong> as readiness signals. They are not a mandatory sequence or a gate for a small paid tutorial pilot."
    - "For a scaled community program, consider a <strong>social listening bot</strong> to surface mentions and potential ambassadors; it is not a prerequisite for a small tutorial pilot."
    - "Use <strong>three tracks</strong>: voluntary community participation; tutorial creators with an agreed base fee and verified conversion bonus; code contributors evaluated through PR quality and engineering collaboration."
  stats:
    - ["Readiness references for a scaled community program", "6"]
    - ["Progression tiers", "4 (Bronze→Platinum)"]
    - ["Incentive pillars", "5"]
    - ["Typical active rate", "~25%"]
    - ["Founder time with each first country ambassador", "~4 hours (as told firsthand)"]
    - ["Notion affiliate revenue share", "~50% (10-20% is enough for most)"]
    - ["One super user can convert", "~10K signups (50-100 such users, as-spoken)"]
  howto:
    title: "How to run an ambassador program"
    steps:
      - name: "1 · Assess readiness for the chosen scale"
        text: "For a scaled community program, review product usability, internal use, workflow fit, content capacity, roadmap communication and program ownership. Treat these as readiness references. A small tutorial pilot needs a usable workflow and capacity to support incoming users; define its scope and review date before expanding."
      - name: "2 · Set up the community (6 steps)"
        text: "Pick the platform and positioning, set rules, define admin standards, monitor brand mentions (Notion built a crawler — every mention gets a reshare/follow), build a wiki, and set baseline metrics."
      - name: "3 · Recruit on A+B"
        text: "Require both event-organizing ability (A) and content output (B: video / writing / templates). Quality over quantity — Notion's roster is hundreds but only ~25% stay active."
      - name: "4 · Tier with points"
        text: "Bronze (apply) → Silver (≥100 pts/yr) → Gold (≥300) → Platinum (≥600), earned via tutorials, videos, talks, translations and referrals."
      - name: "5 · Incentivize & retain"
        text: "Lead with the 5 pillars — a genuinely good product, beta access, founder conversations, KOL-making reshares, and resharing every creator — and run churn early-warning (private check-in after 2 months of no contribution)."
  compare:
    title: "The 4-tier ambassador system"
    intro: "Progression by annual points; higher tiers unlock access, not just badges."
    columns: ["Tier", "Threshold", "Core benefit"]
    rows:
      - ["Bronze", "Apply", "Recognition + badge"]
      - ["Silver", "≥100 pts/yr", "Priority beta + official reshares"]
      - ["Gold", "≥300 pts/yr", "1:1 contact + annual event"]
      - ["Platinum", "≥600 pts/yr", "Custom support + sponsorship"]
  donts:
    title: "Anti-patterns (where ambassador programs fail)"
    items:
      - "Launching a tutorial pilot without a usable workflow or capacity to support the users it brings."
      - "Recruiting on follower count instead of A+B (organizing + content)."
      - "Relying on swag instead of founder access and KOL-making support."
      - "Ignoring a 2-month silence — that's the churn early-warning signal."
  faqs:
    - q: "When is it too early to start an ambassador program?"
      a: "A scaled community program needs a readiness review across product, team and operations. A small tutorial pilot can start with a usable workflow and capacity to support incoming users. Keep its scope limited and use the results to decide whether to expand."
    - q: "What actually motivates ambassadors?"
      a: "Per Notion's data: a genuinely good product (the prerequisite), beta access, direct founder conversations, active help becoming a KOL (official reshares), and resharing every creator's mentions. Material swag ranks far below access."
    - q: "How do I structure tiers?"
      a: "Four point-based tiers — Bronze (apply), Silver (≥100/yr), Gold (≥300), Platinum (≥600) — with points from tutorials, videos, talks, translations and referrals, unlocking progressively deeper access."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars), drawing on real ambassador interviews from Notion (20M users), Asana and ClickUp."
    - q: "Should ambassadors be paid?"
      a: "Choose the track first. Volunteer ambassadors contribute without mandatory deliverables. Tutorial creators can receive a base fee for agreed content plus a bonus on attributable registrations or payments, using defined settlement rules. Code contributors follow PR review and engineering agreements. The AFFiNE unpaid ambassador example is a volunteer-program case, not a universal no-payment rule."
    - q: "How did Notion pick its first ambassadors?"
      a: "From usage data plus organic advocacy — whoever used it deepest and posted about it unprompted, one per country. The founder then reportedly flew to meet each first country ambassador for about 4 hours to instill the vision (firsthand account from a Notion HQ visit; figures as-spoken)."
    - q: "How do ambassadors make money?"
      a: "Notion's model: ~50% affiliate share on converted annual users (industry-high; 10-20% suffices for most products) plus a template economy — custom templates at $300-800 on freelance marketplaces, with top Southeast Asia ambassadors reportedly earning ~SGD 20K/month. Users become a sales force you never put on payroll."
