  takeaways:
    - "Target a repeatable <strong>300 stars/month</strong> cadence, not one-off viral spikes."
    - "<strong>Reddit is the steady workhorse</strong> (2–3 posts/week → direct star conversion); <strong>Hacker News is the spike</strong> (200–500 stars/post)."
    - "<strong>Ship 8–12 content pieces/month</strong> across blog, video, and social — long-tail SEO compounds."
    - "Build a <strong>contributor ladder</strong> (Good First Issue → Core → Maintainer) so the community produces growth, not just you."
