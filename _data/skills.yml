- slug: user-interview
  hf: gingiris-user-interview
  install: Gingiris-1031/gingiris-user-interview
  title: "User Interview & Beta Testing Playbook — Find PMF | Gingiris"
  h1: "User Interview &amp; Beta Testing Playbook"
  tagline: "The 5-step interview framework + beta-test design that surfaces the real must-have and willingness to pay."
  meta_description: "User interview playbook: who to interview (P0–P2), the 30-45 min 5-part script, beta-test 3-layer design, and the 5-question close. Find PMF and willingness to pay, not vanity feedback."
  keywords: "user interview, customer interview, PMF validation, beta testing, willingness to pay, user research, product feedback, customer discovery, find product market fit"
  software_description: "User interview and beta-testing playbook to find PMF: how to pick and prioritize interviewees (paid / power / competitor / churned), a 30–45 minute 5-part interview script, a 3-layer beta-test design, and a structured 5-question close — surfacing the real must-have and willingness to pay."
  app_category: BusinessApplication
  what: "Most \"user feedback\" is vanity — happy users being polite. This playbook gets the <strong>real must-have and the real willingness to pay</strong>: who to interview, a structured 30–45 minute script, a 3-layer beta test, and a 5-question close that forces honest signal."
  takeaways:
    - "Prioritize <strong>paid + power users (P0)</strong> and <strong>churned users</strong> — churned users expose the real problems."
    - "Run a structured <strong>5-part, 30–45 min script</strong>: background → workflow → competitors → pain → willingness to pay."
    - "Beta tests need <strong>3 layers</strong>: value validation, experience perception, gap identification."
    - "Close with the <strong>5-question method</strong> — including \"would you pay if we launched tomorrow, and why?\""
  stats:
    - ["Interview script length", "30–45 min"]
    - ["Interview script parts", "5"]
    - ["Synthesis cadence", "every 5–10 sessions"]
    - ["Beta-test layers", "3"]
  howto:
    title: "The 5-step user interview framework"
    steps:
      - name: "1 · Target & screen"
        text: "Prioritize by value: P0 paid users and power users (highest-signal), P1 competitor users and churned users (competitive view + real problems), P2 registered-but-unpaid (conversion blockers)."
      - name: "2 · Invite & schedule"
        text: "Reach out and book sessions with the right mix, weighting toward P0 and churned users."
      - name: "3 · Run the interview (30–45 min)"
        text: "Five parts: background (role, channels, tenure, competitors) → workflow (what problem, how before, what changed) → competitor comparison → pain mining (bugs, friction, the \"magic wand\" question) → willingness to pay (what they've paid, how much, upgrade triggers)."
      - name: "4 · Close & follow up"
        text: "Wrap cleanly, confirm next steps, and keep the relationship open for beta access and follow-up."
      - name: "5 · Synthesize (every 5–10 sessions)"
        text: "Aggregate findings every 5–10 interviews to spot patterns rather than over-indexing on any single voice."
  compare:
    title: "Who to interview — priority by value"
    intro: "Not all feedback is equal; weight toward the users whose signal predicts revenue."
    columns: ["Priority", "User type", "Why"]
    rows:
      - ["P0", "Paid users", "Validated willingness to pay — highest value"]
      - ["P0", "Power users", "Deep product knowledge — most actionable"]
      - ["P1", "Churned users", "Expose the product's real problems"]
      - ["P2", "Registered, unpaid", "Reveal conversion blockers"]
  donts:
    title: "Anti-patterns (where interviews mislead)"
    items:
      - "Only interviewing happy users — politeness ≠ product-market fit."
      - "Leading questions that fish for the answer you want."
      - "Skipping the willingness-to-pay question — the only real validation."
      - "Acting on a single interview instead of synthesizing every 5–10."
  faqs:
    - q: "Who should I interview first?"
      a: "P0 — paid users (validated willingness to pay) and power users (deepest product knowledge). Then P1 churned users, who expose the real problems happy users won't mention. Registered-but-unpaid (P2) reveal conversion blockers."
    - q: "How do I get honest willingness-to-pay signal?"
      a: "Ask what they've actually paid for before, how much, and what triggered an upgrade — then the 5-question close including \"would you pay if we launched tomorrow, and why?\". Past behavior and a concrete commitment beat hypothetical enthusiasm."
    - q: "How many interviews before I trust the data?"
      a: "Synthesize every 5–10 sessions to spot patterns. One vivid interview is an anecdote; recurring themes across a batch are signal."
    - q: "Who built this?"
      a: "Iris Wei (生姜) — ex-COO of AFFiNE (60K+ GitHub stars), advisor to 150+ AI startups on PMF and user research."
  related:
